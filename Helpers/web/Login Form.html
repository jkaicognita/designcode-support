<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2301696f'/%3E%3Cpath d='M16 8a4 4 0 0 0-4 4v3H9v9h14v-9h-3v-3a4 4 0 0 0-4-4zm-2 7v-3a2 2 0 1 1 4 0v3z' fill='%23f7f6f2'/%3E%3C/svg%3E" />
  <style>
    :root,
    [data-theme='light'] {
      --color-bg: #f7f6f2;
      --color-surface: #ffffff;
      --color-surface-2: #fbfbf9;
      --color-border: oklch(0.2 0.01 80 / 0.12);
      --color-text: #28251d;
      --color-text-muted: #7a7974;
      --color-text-faint: #bab9b4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-highlight: #cedcd8;
      --color-error: #a12c7b;
      --color-error-highlight: #e0ced7;
      --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 24px 60px oklch(0.2 0.01 80 / 0.14);
    }

    [data-theme='dark'] {
      --color-bg: #171614;
      --color-surface: #1c1b19;
      --color-surface-2: #22211f;
      --color-border: oklch(0 0 0 / 0.28);
      --color-text: #cdccca;
      --color-text-muted: #797876;
      --color-text-faint: #5a5957;
      --color-primary: #4f98a3;
      --color-primary-hover: #227f8b;
      --color-primary-highlight: #313b3b;
      --color-error: #d163a7;
      --color-error-highlight: #4c3d46;
      --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
      --shadow-lg: 0 24px 60px oklch(0 0 0 / 0.5);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-4, 1rem);
      font-family: 'General Sans', 'Inter', system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-text);
      background-color: var(--color-bg);
      background-image: radial-gradient(60rem 60rem at 110% -10%, var(--color-primary-highlight) 0%, transparent 45%);
    }

    :root {
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
      --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
      --text-sm: 0.875rem; --text-lg: 1.125rem; --text-xl: 1.5rem;
      --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem;
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card {
      width: 100%;
      max-width: 24rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: var(--space-8) var(--space-8) var(--space-10);
    }

    .brand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-8); }

    .logo {
      display: grid; place-items: center;
      width: 2.5rem; height: 2.5rem;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: #f7f6f2;
    }
    .logo svg { width: 1.5rem; height: 1.5rem; }

    .brand-name {
      font-family: 'Cabinet Grotesk', 'General Sans', sans-serif;
      font-weight: 700; font-size: var(--text-lg);
      letter-spacing: -0.01em;
    }

    h1 {
      font-family: 'Cabinet Grotesk', 'General Sans', sans-serif;
      font-size: var(--text-xl); font-weight: 700;
      letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: var(--space-2);
    }

    .subtitle { color: var(--color-text-muted); font-size: var(--text-sm); margin-bottom: var(--space-8); }

    .field { margin-bottom: var(--space-5); }
    .field label {
      display: block; font-size: var(--text-sm); font-weight: 500;
      margin-bottom: var(--space-2); color: var(--color-text);
    }

    .input-wrap { position: relative; }

    input[type='email'], input[type='password'] {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      padding-right: 2.75rem;
      font-family: inherit; font-size: var(--text-sm);
      color: var(--color-text);
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive);
    }
    input::placeholder { color: var(--color-text-faint); }
    input:focus-visible { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-highlight); }

    .field.invalid input { border-color: var(--color-error); }
    .field.invalid input:focus-visible { box-shadow: 0 0 0 3px var(--color-error-highlight); }

    .toggle-pass {
      position: absolute; top: 50%; right: var(--space-2);
      transform: translateY(-50%);
      display: grid; place-items: center;
      width: 2rem; height: 2rem;
      color: var(--color-text-muted);
      background: none;
      border: none;
      border-radius: var(--radius-sm);
    }
    .toggle-pass:hover { color: var(--color-text); }
    .toggle-pass svg { width: 1.125rem; height: 1.125rem; }

    .error-text {
      display: none; font-size: var(--text-sm);
      color: var(--color-error); margin-top: var(--space-2);
    }
    .field.invalid .error-text { display: block; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-4); margin-bottom: var(--space-6);
      font-size: var(--text-sm);
    }
    .checkbox { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; color: var(--color-text-muted); }
    .checkbox input { width: 1rem; height: 1rem; accent-color: var(--color-primary); }
    .link { color: var(--color-primary); text-decoration: none; font-weight: 500; }
    .link:hover { color: var(--color-primary-hover); }

    .btn {
      width: 100%; padding: var(--space-3) var(--space-4);
      font-family: inherit; font-size: var(--text-sm); font-weight: 600;
      color: #f7f6f2; background: var(--color-primary);
      border: none; border-radius: var(--radius-md);
      transition: background var(--transition-interactive), transform var(--transition-interactive);
    }
    .btn:hover:not(:disabled) { background: var(--color-primary-hover); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      display: none; width: 1rem; height: 1rem;
      border: 2px solid oklch(1 0 0 / 0.35);
      border-top-color: #f7f6f2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .label { opacity: 0; }
    .btn.loading .spinner { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    .btn { position: relative; }

    .divider {
      display: flex; align-items: center; gap: var(--space-3);
      margin: var(--space-6) 0; color: var(--color-text-faint);
      font-size: var(--text-sm);
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }

    .signup { text-align: center; font-size: var(--text-sm); color: var(--color-text-muted); }

    .success {
      display: none; text-align: center; padding: var(--space-4) 0;
    }
    .success.show { display: block; animation: fade 0.3s ease; }
    .success .check {
      display: grid; place-items: center; margin: 0 auto var(--space-4);
      width: 3.5rem; height: 3.5rem; border-radius: 50%;
      background: var(--color-primary-highlight); color: var(--color-primary);
    }
    .success .check svg { width: 1.75rem; height: 1.75rem; }
    .success p { color: var(--color-text-muted); font-size: var(--text-sm); }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .theme-toggle {
      position: fixed; top: var(--space-4); right: var(--space-4);
      display: grid; place-items: center;
      width: 2.5rem; height: 2.5rem;
      color: var(--color-text-muted);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 50%;
      box-shadow: var(--shadow-md);
    }
    .theme-toggle:hover { color: var(--color-text); }
    .theme-toggle svg { width: 1.125rem; height: 1.125rem; }

    .form.hidden { display: none; }

    @media (max-width: 420px) {
      .card { padding: var(--space-6); }
      .row { flex-direction: column; align-items: flex-start; gap: var(--space-3); }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>

  <main class="card">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <span class="brand-name">Nimbus</span>
    </div>

    <!-- Login form -->
    <form class="form" id="loginForm" novalidate>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue.</p>

      <div class="field" id="emailField">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <p class="error-text" id="emailError">Please enter a valid email address.</p>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required minlength="6" />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="error-text" id="passwordError">Password must be at least 6 characters.</p>
      </div>

      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember" />
          Remember me
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span class="label">Sign in</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <div class="divider">or</div>

      <p class="signup">Don't have an account? <a href="#" class="link">Sign up</a></p>
    </form>

    <!-- Success state -->
    <div class="success" id="success" role="status" aria-live="polite">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>You're signed in</h1>
      <p>Redirecting you to your dashboard…</p>
    </div>
  </main>

  <script>
    (function () {
      // ---- Theme toggle ----
      var root = document.documentElement;
      var tBtn = document.querySelector('[data-theme-toggle]');
      var mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', mode);

      var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
      var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

      function setIcon() {
        tBtn.innerHTML = mode === 'dark' ? sun : moon;
        tBtn.setAttribute('aria-label', 'Switch to ' + (mode === 'dark' ? 'light' : 'dark') + ' mode');
      }
      setIcon();

      tBtn.addEventListener('click', function () {
        mode = mode === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', mode);
        setIcon();
      });

      // ---- Password show / hide ----
      var pass = document.getElementById('password');
      var togglePass = document.getElementById('togglePass');
      togglePass.addEventListener('click', function () {
        var show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        togglePass.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });

      // ---- Validation ----
      var form = document.getElementById('loginForm');
      var email = document.getElementById('email');
      var password = document.getElementById('password');
      var emailField = document.getElementById('emailField');
      var passwordField = document.getElementById('passwordField');
      var submitBtn = document.getElementById('submitBtn');

      var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function validateEmail() {
        var ok = emailRe.test(email.value.trim());
        emailField.classList.toggle('invalid', !ok);
        return ok;
      }
      function validatePassword() {
        var ok = password.value.length >= 6;
        passwordField.classList.toggle('invalid', !ok);
        return ok;
      }

      // Clear error as the user types
      email.addEventListener('input', function () { if (emailField.classList.contains('invalid')) validateEmail(); });
      password.addEventListener('input', function () { if (passwordField.classList.contains('invalid')) validatePassword(); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var valid = validateEmail() & validatePassword(); // bitwise: runs both
        if (!valid) {
          // focus the first invalid field
          if (!emailRe.test(email.value.trim())) email.focus();
          else password.focus();
          return;
        }

        // Simulated auth request
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        submitBtn.querySelector('.label').textContent = 'Signing in…';

        setTimeout(function () {
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          submitBtn.querySelector('.label').textContent = 'Sign in';
          form.classList.add('hidden');
          document.getElementById('success').classList.add('show');
        }, 1200);
      });
    })();
  </script>

      if (!srcMatch) return null;

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();


</script></body>
